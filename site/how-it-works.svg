<text x="1050.0" y="142.0" class="rname" text-anchor="start">THE TRANSCRIPT</text>
<text x="1050.0" y="164.0" class="rnote" text-anchor="start">Every turn joins it,</text>
<text x="1050.0" y="178.0" class="rnote" text-anchor="start">in order. The</text>
<text x="1050.0" y="192.0" class="rnote" text-anchor="start">synthesizer reads</text>
<text x="1050.0" y="206.0" class="rnote" text-anchor="start">all of it.</text>
<rect class="card" x="435.0" y="1154.0" width="380" height="92" rx="14" stroke="var(--sol)" stroke-width="1.6"/>
<rect class="fsol" x="435.0" y="1154.0" width="4" height="92" rx="2"/>
<text x="625.0" y="1180.0" class="rname" text-anchor="middle">SYNTHESIS</text>
<text x="625.0" y="1202.0" class="nname" text-anchor="middle">GPT (OpenAI)</text>
<text x="625.0" y="1222.0" class="rnote" text-anchor="middle">fresh context — it reads the record, it does not carry its own side</text>
<text x="44.0" y="1180.0" class="rnum" text-anchor="start">05</text>
<text x="44.0" y="1198.0" class="rname" text-anchor="start">SYNTHESIS</text>
<text x="44.0" y="1218.0" class="rnote" text-anchor="start">The strongest combined</text>
<text x="44.0" y="1232.0" class="rnote" text-anchor="start">answer, preserving the</text>
<text x="44.0" y="1246.0" class="rnote" text-anchor="start">disagreement rather than</text>
<text x="44.0" y="1260.0" class="rnote" text-anchor="start">averaging it away.</text>
<path class="qedge" marker-end="url(#a-q)" d="M625.0,1246.0 L625.0,1292.0"/>
<text x="625.0" y="1314.0" class="callb" text-anchor="middle">One answer, with the disagreements still inspectable</text>
<line class="divider" x1="44" y1="1334" x2="1206" y2="1334"/>
<path class="mem opus" d="M44,1362 L90,1362"/>
<text x="102.0" y="1366.0" class="call" text-anchor="start">carries its own memory forward — the same conversation, one turn longer</text>
<path class="cross opus" d="M44,1386 L90,1386"/>
<text x="102.0" y="1390.0" class="call" text-anchor="start">receives the other three's answers — never its own</text>
<path class="tap" d="M44,1410 L90,1410"/>
<text x="102.0" y="1414.0" class="call" text-anchor="start">every turn joins the transcript the synthesizer reads</text>
<text x="1206.0" y="1366.0" class="lbl" text-anchor="end">Colour is the model that spoke.</text>
<text x="1206.0" y="1384.0" class="lbl" text-anchor="end">Every arc is one API call, made from the browser.</text>
<text x="1206.0" y="1402.0" class="lbl" text-anchor="end">17 calls in a four-round run.</text>
