<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1470" width="1250" height="1470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
<title id="t">How one question becomes one answer in Clock</title>
<desc id="d">Four AI models answer a question independently in round one with no connections between them, then exchange answers across three further rounds, and the whole transcript flows into a single synthesis node.</desc>
<style>
  :root{
    --paper:#EFF1EC; --surface:#FAFBF8; --ink:#191C19; --ink2:#454B44; --ink3:#646B62;
    --rule:#D5D9CE; --brass:#6E6A3C;
    --opus:#8F4A18; --sol:#1C6B5C; --gemini:#3A5A99; --grok:#8A3A5E;
    --opusW:#F6EAE0; --solW:#E2EFEB; --geminiW:#E5EAF5; --grokW:#F5E6EC;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#14171A; --surface:#1B1F23; --ink:#E7EAE4; --ink2:#AEB5AC; --ink3:#8C938B;
      --rule:#2C3238; --brass:#B5AE72;
      --opus:#E09550; --sol:#54B9A0; --gemini:#88A8E4; --grok:#D68BAD;
      --opusW:#2A2018; --solW:#162925; --geminiW:#1A2130; --grokW:#2A1A22;
    }
  }
  .bg{fill:var(--paper)}
  .h1{fill:var(--ink);font-size:27px;font-weight:600;letter-spacing:-.6px}
  .h2{fill:var(--ink2);font-size:14.5px}
  .rnum{fill:var(--brass);font-size:12px;letter-spacing:1px;
        font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .rname{fill:var(--ink);font-size:13px;font-weight:650;letter-spacing:1.6px}
  .rnote{fill:var(--ink3);font-size:11.5px}
  .nname{fill:var(--ink);font-size:14px;font-weight:640;letter-spacing:-.2px}
  .nvend{fill:var(--ink3);font-size:10px;letter-spacing:.4px}
  .card{fill:var(--surface);stroke:var(--rule);stroke-width:1}
  .qcard{fill:var(--surface);stroke:var(--brass);stroke-width:1.4}
  .qtext{fill:var(--ink);font-size:15px;font-weight:600}
  .lbl{fill:var(--ink3);font-size:11px;
       font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.3px}
  .lblb{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .call{fill:var(--ink2);font-size:12px}
  .callb{fill:var(--ink);font-size:12px;font-weight:650}
  .rail{stroke:var(--ink3);stroke-width:1.6;fill:none;opacity:.5}
  .tap{stroke:var(--ink3);stroke-width:1;fill:none;opacity:.45;stroke-dasharray:3 4}
  .mem{stroke-width:2.4;fill:none;opacity:.95}
  .cross{stroke-width:1.15;fill:none;opacity:.42}
  .qedge{stroke:var(--brass);stroke-width:1.5;fill:none;opacity:.75}
  .divider{stroke:var(--rule);stroke-width:1}
  .legbox{fill:var(--surface);stroke:var(--rule);stroke-width:1}
  .opus{stroke:var(--opus)} .sol{stroke:var(--sol)}
  .gemini{stroke:var(--gemini)} .grok{stroke:var(--grok)}
  .fopus{fill:var(--opus)} .fsol{fill:var(--sol)}
  .fgemini{fill:var(--gemini)} .fgrok{fill:var(--grok)}
  .wopus{fill:var(--opusW)} .wsol{fill:var(--solW)}
  .wgemini{fill:var(--geminiW)} .wgrok{fill:var(--grokW)}
</style>
<defs>
<marker id="a-opus" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" class="fopus"/></marker>
<marker id="a-sol" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" class="fsol"/></marker>
<marker id="a-gemini" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" class="fgemini"/></marker>
<marker id="a-grok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" class="fgrok"/></marker>
<marker id="a-q" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" fill="var(--brass)"/></marker>
<marker id="a-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" fill="var(--ink3)"/></marker>
</defs>
<rect class="bg" width="1250" height="1470"/>
<text x="44.0" y="62.0" class="h1" text-anchor="start">How one question becomes one answer</text>
<text x="44.0" y="88.0" class="h2" text-anchor="start">Four frontier models, four rounds, one synthesis — the shape of a single Clock run.</text>
<line class="divider" x1="44" y1="108" x2="1206" y2="108"/>
<rect class="qcard" x="375.5" y="149.0" width="470" height="54" rx="27"/>
<text x="610.5" y="181.0" class="qtext" text-anchor="middle">Your question</text>
<text x="44.0" y="170.0" class="rnum" text-anchor="start">INPUT</text>
<text x="44.0" y="188.0" class="rnote" text-anchor="start">one question</text>
<text x="44.0" y="298.0" class="rnum" text-anchor="start">01</text>
<text x="44.0" y="316.0" class="rname" text-anchor="start">INDEPENDENT</text>
<text x="44.0" y="336.0" class="rnote" text-anchor="start">Each model answers the</text>
<text x="44.0" y="350.0" class="rnote" text-anchor="start">question alone, unaware</text>
<text x="44.0" y="364.0" class="rnote" text-anchor="start">that anyone else exists.</text>
<text x="44.0" y="392.0" class="callb" text-anchor="start">No lines run between</text>
<text x="44.0" y="406.0" class="callb" text-anchor="start">these four. Round one</text>
<text x="44.0" y="420.0" class="callb" text-anchor="start">is blind.</text>
<rect class="card wopus" x="270.0" y="292.0" width="150" height="56" rx="10"/>
<rect class="fopus" x="270.0" y="292.0" width="3.5" height="56" rx="1.75"/>
<text x="345.0" y="318.0" class="nname" text-anchor="middle">Claude</text>
<text x="345.0" y="335.0" class="nvend" text-anchor="middle">ANTHROPIC</text>
<rect class="card wsol" x="447.0" y="292.0" width="150" height="56" rx="10"/>
<rect class="fsol" x="447.0" y="292.0" width="3.5" height="56" rx="1.75"/>
<text x="522.0" y="318.0" class="nname" text-anchor="middle">GPT</text>
<text x="522.0" y="335.0" class="nvend" text-anchor="middle">OPENAI</text>
<rect class="card wgemini" x="624.0" y="292.0" width="150" height="56" rx="10"/>
<rect class="fgemini" x="624.0" y="292.0" width="3.5" height="56" rx="1.75"/>
<text x="699.0" y="318.0" class="nname" text-anchor="middle">Gemini</text>
<text x="699.0" y="335.0" class="nvend" text-anchor="middle">GOOGLE</text>
<rect class="card wgrok" x="801.0" y="292.0" width="150" height="56" rx="10"/>
<rect class="fgrok" x="801.0" y="292.0" width="3.5" height="56" rx="1.75"/>
<text x="876.0" y="318.0" class="nname" text-anchor="middle">Grok</text>
<text x="876.0" y="335.0" class="nvend" text-anchor="middle">XAI</text>
<text x="44.0" y="518.0" class="rnum" text-anchor="start">02</text>
<text x="44.0" y="536.0" class="rname" text-anchor="start">CRITIQUE</text>
<text x="44.0" y="556.0" class="rnote" text-anchor="start">It now reads the other</text>
<text x="44.0" y="570.0" class="rnote" text-anchor="start">three and responds —</text>
<text x="44.0" y="584.0" class="rnote" text-anchor="start">checking, not deferring.</text>
<text x="44.0" y="612.0" class="callb" text-anchor="start">From here on each model</text>
<text x="44.0" y="626.0" class="callb" text-anchor="start">sees the other three,</text>
<text x="44.0" y="640.0" class="callb" text-anchor="start">and never its own.</text>
<rect class="card wopus" x="270.0" y="512.0" width="150" height="56" rx="10"/>
<rect class="fopus" x="270.0" y="512.0" width="3.5" height="56" rx="1.75"/>
<text x="345.0" y="538.0" class="nname" text-anchor="middle">Claude</text>
<text x="345.0" y="555.0" class="nvend" text-anchor="middle">ANTHROPIC</text>
<rect class="card wsol" x="447.0" y="512.0" width="150" height="56" rx="10"/>
<rect class="fsol" x="447.0" y="512.0" width="3.5" height="56" rx="1.75"/>
<text x="522.0" y="538.0" class="nname" text-anchor="middle">GPT</text>
<text x="522.0" y="555.0" class="nvend" text-anchor="middle">OPENAI</text>
<rect class="card wgemini" x="624.0" y="512.0" width="150" height="56" rx="10"/>
<rect class="fgemini" x="624.0" y="512.0" width="3.5" height="56" rx="1.75"/>
<text x="699.0" y="538.0" class="nname" text-anchor="middle">Gemini</text>
<text x="699.0" y="555.0" class="nvend" text-anchor="middle">GOOGLE</text>
<rect class="card wgrok" x="801.0" y="512.0" width="150" height="56" rx="10"/>
<rect class="fgrok" x="801.0" y="512.0" width="3.5" height="56" rx="1.75"/>
<text x="876.0" y="538.0" class="nname" text-anchor="middle">Grok</text>
<text x="876.0" y="555.0" class="nvend" text-anchor="middle">XAI</text>
<text x="44.0" y="738.0" class="rnum" text-anchor="start">03</text>
<text x="44.0" y="756.0" class="rname" text-anchor="start">RECONSIDER</text>
<text x="44.0" y="776.0" class="rnote" text-anchor="start">What moved them, what</text>
<text x="44.0" y="790.0" class="rnote" text-anchor="start">they still hold, what is</text>
<text x="44.0" y="804.0" class="rnote" text-anchor="start">still unresolved.</text>
<rect class="card wopus" x="270.0" y="732.0" width="150" height="56" rx="10"/>
<rect class="fopus" x="270.0" y="732.0" width="3.5" height="56" rx="1.75"/>
<text x="345.0" y="758.0" class="nname" text-anchor="middle">Claude</text>
<text x="345.0" y="775.0" class="nvend" text-anchor="middle">ANTHROPIC</text>
<rect class="card wsol" x="447.0" y="732.0" width="150" height="56" rx="10"/>
<rect class="fsol" x="447.0" y="732.0" width="3.5" height="56" rx="1.75"/>
<text x="522.0" y="758.0" class="nname" text-anchor="middle">GPT</text>
<text x="522.0" y="775.0" class="nvend" text-anchor="middle">OPENAI</text>
<rect class="card wgemini" x="624.0" y="732.0" width="150" height="56" rx="10"/>
<rect class="fgemini" x="624.0" y="732.0" width="3.5" height="56" rx="1.75"/>
<text x="699.0" y="758.0" class="nname" text-anchor="middle">Gemini</text>
<text x="699.0" y="775.0" class="nvend" text-anchor="middle">GOOGLE</text>
<rect class="card wgrok" x="801.0" y="732.0" width="150" height="56" rx="10"/>
<rect class="fgrok" x="801.0" y="732.0" width="3.5" height="56" rx="1.75"/>
<text x="876.0" y="758.0" class="nname" text-anchor="middle">Grok</text>
<text x="876.0" y="775.0" class="nvend" text-anchor="middle">XAI</text>
<text x="44.0" y="958.0" class="rnum" text-anchor="start">04</text>
<text x="44.0" y="976.0" class="rname" text-anchor="start">EXCHANGE</text>
<text x="44.0" y="996.0" class="rnote" text-anchor="start">Questions put by name get</text>
<text x="44.0" y="1010.0" class="rnote" text-anchor="start">answered. Each says the</text>
<text x="44.0" y="1024.0" class="rnote" text-anchor="start">one thing it wants kept.</text>
<rect class="card wopus" x="270.0" y="952.0" width="150" height="56" rx="10"/>
